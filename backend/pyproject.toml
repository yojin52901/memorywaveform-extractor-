[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memorywaveform-extractor"
version = "0.1.0"
description = "Local-first extraction of timing relationships from memory waveform diagrams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.18,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
memorywaveform-extract = "memorywaveform_extractor.cli:main"
memorywaveform-benchmark = "memorywaveform_extractor.benchmark_cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
