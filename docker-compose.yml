services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ARTIFACT_ROOT: /artifacts
      JOB_DATABASE_PATH: /artifacts/jobs.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/artifacts

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:80"
